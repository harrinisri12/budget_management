<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Green Stem Gradient -->
    <linearGradient id="greenStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DC63F"/>
      <stop offset="50%" stop-color="#76B82A"/>
      <stop offset="100%" stop-color="#4E9313"/>
    </linearGradient>

    <!-- Top-Right Lime Leaf Gradient -->
    <linearGradient id="limeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5E038"/>
      <stop offset="100%" stop-color="#8DC63F"/>
    </linearGradient>

    <!-- Blue Ribbon Loop Gradient -->
    <linearGradient id="blueRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B0F0"/>
      <stop offset="40%" stop-color="#0095DA"/>
      <stop offset="100%" stop-color="#0066B3"/>
    </linearGradient>

    <!-- Soft Drop Shadow -->
    <filter id="shadow" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0a2010" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- 1. Top Right Lime Accent Leaf Curve -->
    <path d="M 285 55
             C 340 55, 415 95, 425 165
             C 430 200, 405 235, 368 240
             C 335 245, 310 215, 315 180
             C 322 135, 290 85, 285 55 Z"
          fill="url(#limeAccent)" />

    <!-- 2. Main Vertical Green Stem (Ribbon) -->
    <path d="M 185 45
             C 225 45, 235 90, 228 150
             C 218 230, 218 350, 230 425
             C 235 455, 215 475, 185 475
             C 155 475, 140 450, 145 415
             C 152 335, 150 210, 140 125
             C 135 75, 152 45, 185 45 Z"
          fill="url(#greenStem)" />

    <!-- 3. Blue Swirling Ribbon ("K" Swoosh) -->
    <path d="M 85 270
             C 65 220, 105 175, 160 185
             C 215 195, 275 210, 335 180
             C 390 150, 450 175, 440 235
             C 430 290, 370 330, 305 355
             C 240 380, 165 390, 115 345
             C 90 320, 80 295, 105 275
             C 125 260, 155 270, 195 285
             C 245 305, 315 300, 355 345
             C 375 365, 360 400, 330 410
             C 280 425, 210 395, 145 335
             C 115 305, 85 290, 85 270 Z"
          fill="url(#blueRibbon)" />
  </g>
</svg>
