<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%" preserveAspectRatio="xMidYMid meet">
  <defs>
    <!-- Green Stem Gradient -->
    <linearGradient id="greenStem" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8DC63F"/>
      <stop offset="50%" stop-color="#76B82A"/>
      <stop offset="100%" stop-color="#4E9313"/>
    </linearGradient>

    <!-- Top-Right Lime Leaf Gradient -->
    <linearGradient id="limeAccent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C5E038"/>
      <stop offset="100%" stop-color="#8DC63F"/>
    </linearGradient>

    <!-- Blue Ribbon Loop Gradient -->
    <linearGradient id="blueRibbon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00B0F0"/>
      <stop offset="45%" stop-color="#0095DA"/>
      <stop offset="100%" stop-color="#0066B3"/>
    </linearGradient>

    <!-- Soft Drop Shadow for depth -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0a2010" flood-opacity="0.12"/>
    </filter>
  </defs>

  <g filter="url(#shadow)">
    <!-- 1. Top Right Lime Accent Leaf Curve -->
    <path d="M 285 35
             C 345 35, 430 75, 442 155
             C 448 195, 418 235, 375 240
             C 338 245, 310 212, 316 172
             C 324 122, 290 68, 285 35 Z"
          fill="url(#limeAccent)" />

    <!-- 2. Main Vertical Green Stem (Ribbon) -->
    <path d="M 185 25
             C 230 25, 240 75, 232 140
             C 220 230, 220 360, 235 440
             C 240 475, 215 495, 185 495
             C 155 495, 135 470, 142 430
             C 150 340, 148 205, 138 110
             C 132 55, 150 25, 185 25 Z"
          fill="url(#greenStem)" />

    <!-- 3. Blue Swirling Ribbon ("K" Swoosh) -->
    <path d="M 65 260
             C 40 205, 85 155, 145 165
             C 205 175, 270 190, 335 160
             C 395 130, 460 155, 450 220
             C 438 285, 370 330, 300 358
             C 230 385, 145 395, 90 345
             C 60 315, 55 285, 85 265
             C 108 248, 140 260, 185 278
             C 240 300, 315 295, 360 345
             C 382 368, 365 408, 330 418
             C 275 435, 195 400, 125 335
             C 90 300, 65 280, 65 260 Z"
          fill="url(#blueRibbon)" />
  </g>
</svg>
